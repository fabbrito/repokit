# repokit's own message policy. Lanes live in lefthook.yml.
schema = 2

types       = feat fix refactor chore style docs build perf test
subject_max = 72
bullet_max  = 2
body_cols   = 80

scope_fixed = grader templates conf tests make docs repo release

trailer_person    = Co-Authored-By Signed-off-by Reviewed-by
trailer_reference = Refs Closes Fixes
