# repokit's own tools. The templates' pins arrive through .config/mise/conf.d/,
# symlinks into templates/ - this repo runs the bytes it ships. A pin here
# wins over a template's.
[tools]
lefthook = "2.1.15"
# Prettier is this repo's docs formatter, not a template: it stays here.
node = "26.10.0"
"npm:prettier" = "3.9.9"
# The harness reads lefthook dump with it.
jq = "1.8.2"
